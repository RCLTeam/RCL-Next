services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rcl
      POSTGRES_USER: rcl
      POSTGRES_PASSWORD: rcl_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcl -d rcl"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
