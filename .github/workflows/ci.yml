name: CI

on:
  push:
    branches: [main, MergeBranch]
  pull_request:
    branches: [main, MergeBranch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Run Python Parser Tests
        run: python3 -m unittest discover -s apps/parser/tests -p "test_*.py" -v

  deploy:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rcl-next
      cancel-in-progress: false
    steps:
      - name: Trigger CD script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: /usr/local/sbin/actualizarRCLNext
